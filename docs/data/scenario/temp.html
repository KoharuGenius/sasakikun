<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background-color: #F5F5DC; /* グラデーションが見やすいダーク背景 */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    .wavy-container {
      display: inline-block;
      font-size: 2.5rem;
      font-weight: bold;
    }

    /* 各文字のスタイル */
    .wavy-char {
      display: inline-block;
      
      /* 文字色をグラデーションにする設定 */
      background: linear-gradient(135deg, #e0e0e0 0%, #707070 50%, #ffffff 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      /* アニメーションの適用：上下揺れ(wave) と グラデーション移動(grad) */
      animation: 
        wave 2s ease-in-out infinite,
        grad 4s linear infinite;
    }

    /* 1文字ずつ開始時間をずらして「波」をつくる */
    .wavy-char:nth-child(1) { animation-delay: 0.0s; }
    .wavy-char:nth-child(2) { animation-delay: 0.2s; }
    .wavy-char:nth-child(3) { animation-delay: 0.4s; }
    .wavy-char:nth-child(4) { animation-delay: 0.6s; }
    .wavy-char:nth-child(5) { animation-delay: 0.8s; }
    .wavy-char:nth-child(6) { animation-delay: 1.0s; }
    .wavy-char:nth-child(7) { animation-delay: 1.2s; }
    .wavy-char:nth-child(8) { animation-delay: 1.4s; }

    /* 上下にゆらゆら揺れるキーフレーム */
    @keyframes wave {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px); /* 上に12px動く */
      }
    }

    /* 灰色グラデーションが動くキーフレーム */
    @keyframes grad {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
  </style>
</head>
<body>

  <div class="wavy-container">
    <span class="wavy-char">♨</span>
    <span class="wavy-char">地</span>
    <span class="wavy-char">磁</span>
    <span class="wavy-char">気</span>
    <span class="wavy-char">の</span>
    <span class="wavy-char">乱</span>
    <span class="wavy-char">れ</span>
    <span class="wavy-char">♨</span>
  </div>

</body>
</html>
